{% extends "base.html" %}

{% block title %}Sign In - CineConnect{% endblock %}

{% block content %}
<div class="form-card">
  <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
  <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
    Sign in to book tickets, manage screenings, or submit films.
  </p>

  <div id="login-alert" style="display: none;"></div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" class="form-control" required placeholder="viewer@example.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
  </form>

  <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("login-alert");
  alertBox.style.display = "none";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await CineAPI.request("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ email, password })
    });

    CineAPI.setAuth(res.data.token, res.data.user);
    
    // Redirect based on role
    if (res.data.user.role === "FILMMAKER") {
      window.location.href = "/filmmaker/dashboard";
    } else if (res.data.user.role === "CINEMA") {
      window.location.href = "/cinema/dashboard";
    } else if (res.data.user.role === "ADMIN") {
      window.location.href = "/admin/dashboard";
    } else {
      window.location.href = "/";
    }
  } catch (err) {
    alertBox.className = "alert alert-danger";
    alertBox.textContent = err.message;
    alertBox.style.display = "block";
  }
});
</script>
{% endblock %}
